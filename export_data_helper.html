<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>数据导出助手 - 安监系统</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:system-ui,sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh;padding:40px 20px;}
.card{max-width:600px;margin:0 auto;background:#1e293b;border-radius:16px;padding:32px;border:1px solid #334155;}
h1{font-size:1.4rem;margin-bottom:8px;color:#f8fafc;}
.desc{color:#94a3b8;font-size:0.85rem;margin-bottom:24px;line-height:1.6;}
.btn{display:block;width:100%;padding:14px;border:none;border-radius:10px;font-size:1rem;cursor:pointer;font-weight:600;text-align:center;margin-bottom:12px;transition:all .2s;}
.btn-primary{background:#3b82f6;color:#fff;}
.btn-primary:hover{background:#2563eb;}
.btn-success{background:#10b981;color:#fff;}
.btn-success:hover{background:#059669;}
.log{background:#0f172a;border-radius:10px;padding:16px;margin-top:20px;font-family:monospace;font-size:0.8rem;max-height:400px;overflow-y:auto;white-space:pre-wrap;line-height:1.5;border:1px solid #334155;display:none;}
.log .ok{color:#10b981;}
.log .warn{color:#f59e0b;}
.log .err{color:#ef4444;}
.status{display:none;align-items:center;gap:10px;padding:12px 16px;border-radius:10px;margin-top:16px;font-size:0.85rem;}
.status.ok{background:#065f46;border:1px solid #10b981;color:#6ee7b7;}
.status.warn{background:#78350f;border:1px solid #f59e0b;color:#fcd34d;}
.spinner{display:inline-block;width:18px;height:18px;border:2px solid transparent;border-top-color:currentColor;border-radius:50%;animation:spin .6s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="card">
  <h1>📦 知识库数据导出</h1>
  <p class="desc">
    此工具会从本系统（同域名下）的 IndexedDB 和 localStorage 中提取所有数据，
    导出为 JSON 文件供向量索引构建脚本使用。<br><br>
    ⚠️ 请确保之前在此浏览器中打开过系统主页并导入了数据。必须从 <code>haibing321.github.io/36075739-2/</code> 访问此工具。
  </p>
  
  <button class="btn btn-primary" onclick="startExport()">🔍 扫描并导出所有数据</button>
  
  <div id="status" class="status"></div>
  <div id="log" class="log"></div>
  
  <div style="margin-top:20px;font-size:0.78rem;color:#64748b;text-align:center;">
    导出完成后，将 JSON 文件放入 data_export/ 目录，<br>然后运行 python build_knowledge_base.py
  </div>
</div>

<script>
var logEl = document.getElementById('log');
var statusEl = document.getElementById('status');

function log(msg, type) {
  if (!logEl.style.display || logEl.style.display === 'none') logEl.style.display = 'block';
  logEl.innerHTML += '<span class="' + (type||'') + '">' + msg + '</span>\n';
  logEl.scrollTop = logEl.scrollHeight;
}

function status(msg, type) {
  statusEl.style.display = 'flex';
  statusEl.className = 'status ' + (type || 'ok');
  statusEl.innerHTML = '<span class="spinner"></span> ' + msg;
}

function statusDone(msg, type) {
  statusEl.style.display = 'flex';
  statusEl.className = 'status ' + (type || 'ok');
  statusEl.innerHTML = msg;
}

function readDB(dbName, storeName, version) {
  return new Promise(function(resolve, reject) {
    var req = indexedDB.open(dbName, version || 1);
    req.onerror = function() { resolve([]); }; // DB not found = empty
    req.onsuccess = function() {
      var db = req.result;
      if (!db.objectStoreNames.contains(storeName)) { db.close(); return resolve([]); }
      var tx = db.transaction(storeName, 'readonly');
      var store = tx.objectStore(storeName);
      var getAll = store.getAll();
      getAll.onsuccess = function() { resolve(getAll.result || []); db.close(); };
      getAll.onerror = function() { resolve([]); db.close(); };
    };
  });
}

function readLocal(key) {
  try {
    var val = localStorage.getItem(key);
    return val ? JSON.parse(val) : null;
  } catch(e) { return null; }
}

function downloadJSON(data, filename) {
  var blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

async function startExport() {
  logEl.innerHTML = '';
  logEl.style.display = 'block';
  var totalRecords = 0;

  // ===== IndexedDB 数据源 =====
  var dbSources = [
    { db: 'RailwayRuleDB',   store: 'ruleCollection', label: '规章制度', filename: '规章制度.json' },
    { db: 'RailwayIssueDB_v2', store: 'issues',       label: '检查信息', filename: '检查信息.json' },
    { db: 'DiaryMediaDB',    store: 'media',          label: '日志媒体', filename: '日志媒体.json' },
  ];

  for (var i = 0; i < dbSources.length; i++) {
    var src = dbSources[i];
    status('正在导出 ' + src.label + '...');
    try {
      var data = await readDB(src.db, src.store);
      if (data && data.length > 0) {
        downloadJSON(data, src.filename);
        log('✅ ' + src.label + ': ' + data.length + ' 条 → ' + src.filename, 'ok');
        totalRecords += data.length;
      } else {
        log('⚠️ ' + src.label + ': 无数据（可能需要先在系统中导入）', 'warn');
      }
    } catch(e) {
      log('❌ ' + src.label + ': ' + e.message, 'err');
    }
  }

  // ===== localStorage 数据源 =====
  var localSources = [
    { key: 'handbook_fourlevel_v1', label: '检查手册', filename: '检查手册.json' },
    { key: 'railway_phone_db_v1',      label: '车站电话', filename: '车站电话.json' },
    { key: 'railway_work_diary_v2',  label: '工作日志', filename: '工作日志.json' },
    { key: 'railway_memo_v1',        label: '备忘录',   filename: '备忘录.json' },
  ];

  for (var j = 0; j < localSources.length; j++) {
    var ls = localSources[j];
    status('正在导出 ' + ls.label + '...');
    try {
      var ld = readLocal(ls.key);
      if (ld) {
        var count = Array.isArray(ld) ? ld.length : (typeof ld === 'object' ? Object.keys(ld).length : 1);
        downloadJSON(ld, ls.filename);
        log('✅ ' + ls.label + ': ' + count + ' 条 → ' + ls.filename, 'ok');
        totalRecords += Array.isArray(ld) ? ld.length : 1;
      } else {
        log('⚠️ ' + ls.label + ': 无数据', 'warn');
      }
    } catch(e) {
      log('❌ ' + ls.label + ': ' + e.message, 'err');
    }
  }

  // 总结
  if (totalRecords > 0) {
    statusDone('✅ 导出完成! ' + totalRecords + ' 条记录已保存（检查浏览器下载栏）', 'ok');
    log('\n📋 总计: ' + totalRecords + ' 条记录');
    log('📂 请将所有 .json 文件移动到: 安监系统重构/data_export/');
    log('🚀 然后运行: python build_knowledge_base.py');
  } else {
    statusDone('⚠️ 未找到任何数据。请先在系统主页导入数据后再运行此工具。', 'warn');
    log('\n💡 提示:');
    log('  1. 确认在此浏览器中访问过 https://haibing321.github.io/36075739-2/');
    log('  2. 确认已导入过规章制度和检查信息数据');
    log('  3. 本工具必须从同一域名（haibing321.github.io）打开');
  }
}
</script>
</body>
</html>
